---
layout: default
---
<main class="pt-32 pb-20 px-6">
  <div class="container mx-auto max-w-3xl">
    <a
      class="inline-flex items-center gap-2 text-muted-foreground hover:text-primary transition-colors mb-8"
      href="/"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left w-4 h-4">
        <path d="m12 19-7-7 7-7"></path>
        <path d="M19 12H5"></path>
      </svg>
      Torna alla home
    </a>

    <article class="opacity-0 animate-fade-up">
      <header class="mb-12">
        <div class="flex items-center gap-4 mb-4">
          <span class="text-sm font-medium text-primary uppercase tracking-wider">
            18F
          </span>

          <div class="flex items-center gap-1 text-muted-foreground text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar w-4 h-4">
              <path d="M8 2v4"></path>
              <path d="M16 2v4"></path>
              <rect width="18" height="18" x="3" y="4" rx="2"></rect>
              <path d="M3 10h18"></path>
            </svg>
            <span>{{ page.date | date: "%d %B %Y" }}</span>
          </div>
        </div>

        <h1 class="font-display text-3xl md:text-4xl font-bold text-foreground leading-tight mb-6">
          {{ page.title }}
        </h1>

        <div class="flex items-center justify-between border-t border-b border-border py-4">

          <button
            class="flex items-center gap-2 text-muted-foreground hover:text-primary transition-colors text-sm"
            onclick="navigator.share && navigator.share({ title: '{{ page.title }}', url: '{{ site.url }}{{ page.url }}' })"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-share2 w-4 h-4">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"></line>
              <line x1="15.41" x2="8.59" y1="6.51" y2="10.49"></line>
            </svg>
            Condividi
          </button>
        </div>
      </header>

      <div class="prose prose-invert max-w-none">
        {{ content }}
      </div>
    </article>

    <div class="mt-16 pt-8 border-t border-border">
      <a class="inline-flex items-center gap-2 text-primary hover:underline" href="/giornale">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left w-4 h-4">
          <path d="m12 19-7-7 7-7"></path>
          <path d="M19 12H5"></path>
        </svg>
      </a>
    </div>
  </div>
</main>
